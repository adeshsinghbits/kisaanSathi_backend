# =========================================================
# KISSAN SATHI - DEVELOPMENT CONFIGURATION
# =========================================================

# =========================================================
# SERVER
# =========================================================

server.port=${SERVER_PORT:8080}


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:smartkrishi}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USERNAME:root}

spring.datasource.password=${DB_PASSWORD:adesh888}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================================
# JWT
# =========================================================

app.jwt.secret=${JWT_SECRET:change_this_to_a_long_random_secret_key_for_development_2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.issuer=${JWT_ISSUER:kissan-sathi}


# =========================================================
# CORS
# =========================================================

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://10.0.2.2:8080}


# =========================================================
# DEVICE
# =========================================================

device.offline-threshold-minutes=${DEVICE_OFFLINE_THRESHOLD_MINUTES:15}


# =========================================================
# DEVELOPMENT DATA SEEDING
# =========================================================

seed.enabled=${SEED_ENABLED:false}

seed.admin-password=${SEED_ADMIN_PASSWORD}

seed.farmer-password=${SEED_FARMER_PASSWORD}


# =========================================================
# LOGGING
# =========================================================

logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}

logging.level.org.hibernate.orm.jdbc.bind=WARN